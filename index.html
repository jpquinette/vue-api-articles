<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Vanilla JS Articles with Micro-Animations</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Articles List</h1>

  <div class="articles" id="articles-container">
    <!-- Articles will be injected here -->
  </div>

  <script>
    // --- Micro-animations ---
    function addHoverEffect() {
      const articles = document.querySelectorAll('.article');
      articles.forEach(article => {
        article.addEventListener('mouseenter', () => {
          article.style.transform = 'scale(1.05)';
          article.style.transition = 'transform 0.3s ease';
          article.style.boxShadow = '0 4px 15px rgba(255,165,0,0.5)';
        });
        article.addEventListener('mouseleave', () => {
          article.style.transform = 'scale(1)';
          article.style.boxShadow = 'none';
        });
      });
    }

    // --- Render articles ---
    function renderArticles(articles) {
      const container = document.getElementById("articles-container");
      container.innerHTML = '';

      articles.forEach(article => {
        const articleDiv = document.createElement('div');
        articleDiv.classList.add('article');
        articleDiv.style.opacity = '0';
        articleDiv.style.transition = 'opacity 0.5s ease';

        const title = document.createElement('h2');
        title.textContent = article.title;

        const body = document.createElement('p');
        body.textContent = article.body;

        articleDiv.appendChild(title);
        articleDiv.appendChild(body);
        container.appendChild(articleDiv);

        // small delay for fade-in effect
        setTimeout(() => { articleDiv.style.opacity = '1'; }, 50);
      });

      // add hover effect after insertion
      addHoverEffect();
    }

    // --- API request using XMLHttpRequest ---
    function fetchArticles() {
      const xhr = new XMLHttpRequest();
      xhr.open("GET", "https://jsonplaceholder.typicode.com/posts?_limit=6", true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if (xhr.status === 200) {
            const articles = JSON.parse(xhr.responseText);
            console.log("Received articles:", articles);
            renderArticles(articles);
          } else {
            console.error("API Error:", xhr.status);
          }
        }
      };
      xhr.send();
    }

    // --- Simple functional test plan ---
    function testRenderArticles() {
      const testArticles = [
        { title: "Test 1", body: "Content 1" },
        { title: "Test 2", body: "Content 2" }
      ];
      renderArticles(testArticles);

      const rendered = document.querySelectorAll('.article');
      console.assert(rendered.length === 2, 'Should create 2 articles');
      console.assert(rendered[0].querySelector('h2').textContent === "Test 1", 'First article title is correct');
      console.assert(rendered[1].querySelector('p').textContent === "Content 2", 'Second article body is correct');

      console.log('Unit tests completed');
    }

    // --- Execution ---
    fetchArticles();
    // Uncomment to run unit test
    // testRenderArticles();
  </script>
</body>
</html>
